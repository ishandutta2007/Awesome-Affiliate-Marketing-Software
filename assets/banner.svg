<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="pillGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.35" />
    </pattern>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
      }
      @keyframes pulseOrb2 {
        0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(0.95) translate(-25px, 20px); opacity: 0.6; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 300px; }
      .flow-line { stroke-dasharray: 6 6; animation: flowDash 3s linear infinite; }
      .float-badge { animation: floatNode 4s ease-in-out infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -1.5px; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <g filter="url(#glowFilter)">
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#0284c7" />
    <circle class="orb-2" cx="980" cy="300" r="160" fill="#7c3aed" />
    <circle cx="600" cy="380" r="120" fill="#0d9488" opacity="0.25" />
  </g>

  <!-- Dynamic Flow Connector Curves (in background) -->
  <g opacity="0.45">
    <path class="flow-line" d="M 150 340 C 350 390, 450 310, 650 340 C 850 370, 950 310, 1080 340" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M 120 80 C 320 40, 500 110, 750 60 C 950 20, 1020 90, 1100 70" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 8" />
  </g>

  <!-- Ambient Card / Border Accents -->
  <rect x="25" y="25" width="1150" height="370" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
  <rect x="35" y="35" width="1130" height="350" rx="12" fill="none" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.2" />

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" filter="url(#pillGlow)" />
    <text class="tag-text" y="5" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">🌟 CURATED AWESOME LIST</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <text class="title-text" font-size="46" fill="url(#textGrad)" text-anchor="middle" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))">
      Awesome Affiliate Marketing Software
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle / Tagline -->
  <g transform="translate(600, 205)" text-anchor="middle">
    <text class="subtitle-text" font-size="19" fill="#94a3b8" text-anchor="middle" letter-spacing="0.2">
      Production-Ready SaaS Platforms &amp; Open-Source Referral Infrastructure
    </text>
    <text class="subtitle-text" font-size="14" fill="#64748b" y="28" text-anchor="middle">
      Affiliate Tracking • Partner Programs • Attribution • Commission Payouts • Fraud Detection
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Interactive Feature Pills -->
  <g class="float-badge" transform="translate(600, 305)">
    <!-- Pill 1 -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="0" width="175" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="22" cy="21" r="6" fill="#38bdf8" />
      <text class="tag-text" x="38" y="26" fill="#e2e8f0">SaaS Platforms</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="22" cy="21" r="6" fill="#818cf8" />
      <text class="tag-text" x="38" y="26" fill="#e2e8f0">Self-Hosted Tools</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="22" cy="21" r="6" fill="#a855f7" />
      <text class="tag-text" x="38" y="26" fill="#e2e8f0">Open Referral API</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="22" cy="21" r="6" fill="#10b981" />
      <text class="tag-text" x="38" y="26" fill="#e2e8f0">Market Dynamics</text>
    </g>
  </g>
</svg>
